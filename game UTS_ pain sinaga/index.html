<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Game Tebak Angka</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        background:
            radial-gradient(circle at top left, #5b21b6, transparent 35%),
            radial-gradient(circle at bottom right, #0ea5e9, transparent 35%),
            linear-gradient(135deg, #0f172a, #172554);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow-x: hidden;
    }

    /* Background bubbles */
    .bubble {
        position: fixed;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        backdrop-filter: blur(5px);
        animation: floating 8s ease-in-out infinite;
        z-index: -1;
    }

    .bubble:nth-child(1) {
        width: 180px;
        height: 180px;
        top: 5%;
        left: 5%;
    }

    .bubble:nth-child(2) {
        width: 120px;
        height: 120px;
        bottom: 10%;
        right: 8%;
        animation-delay: 2s;
    }

    .bubble:nth-child(3) {
        width: 80px;
        height: 80px;
        top: 45%;
        right: 20%;
        animation-delay: 4s;
    }

    @keyframes floating {
        0%,100% {
            transform: translateY(0) scale(1);
        }

        50% {
            transform: translateY(-25px) scale(1.08);
        }
    }

    .game {
        width: 100%;
        max-width: 850px;
        background: rgba(15, 23, 42, 0.82);
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(20px);
        border-radius: 30px;
        padding: 25px;
        box-shadow:
            0 30px 80px rgba(0,0,0,0.45),
            inset 0 1px 0 rgba(255,255,255,0.08);
        animation: gameAppear 0.8s ease;
    }

    @keyframes gameAppear {
        from {
            opacity: 0;
            transform: translateY(40px) scale(.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    header {
        text-align: center;
        margin-bottom: 20px;
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: auto;
        border-radius: 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 34px;
        background: linear-gradient(135deg, #8b5cf6, #06b6d4);
        box-shadow: 0 10px 30px rgba(139,92,246,.35);
        animation: logoFloat 3s ease-in-out infinite;
    }

    @keyframes logoFloat {
        0%,100% { transform: translateY(0) rotate(0); }
        50% { transform: translateY(-7px) rotate(3deg); }
    }

    h1 {
        font-size: clamp(28px, 5vw, 42px);
        margin-top: 12px;
        background: linear-gradient(90deg, #c084fc, #67e8f9);
        -webkit-background-clip: text;
        color: transparent;
    }

    .subtitle {
        color: #cbd5e1;
        margin-top: 5px;
    }

    /* Statistics */
    .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin: 20px 0;
    }

    .stat {
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 15px 10px;
        text-align: center;
        transition: .3s;
    }

    .stat:hover {
        transform: translateY(-4px);
        background: rgba(255,255,255,0.1);
    }

    .stat-icon {
        font-size: 20px;
    }

    .stat-label {
        color: #94a3b8;
        font-size: 12px;
        margin-top: 5px;
    }

    .stat-value {
        font-size: 23px;
        font-weight: 800;
        margin-top: 3px;
    }

    /* Target */
    .target-area {
        text-align: center;
        margin: 25px 0;
    }

    .target-label {
        color: #94a3b8;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .target {
        margin: 10px auto;
        width: 180px;
        height: 110px;
        border-radius: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 58px;
        font-weight: 900;
        background:
            linear-gradient(135deg, rgba(139,92,246,.25), rgba(6,182,212,.15));
        border: 2px dashed rgba(167,139,250,.7);
        box-shadow: 0 15px 40px rgba(0,0,0,.25);
        transition: .3s;
    }

    .target.pulse {
        animation: targetPulse .45s ease;
    }

    @keyframes targetPulse {
        50% {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(34,211,238,.45);
        }
    }

    .instruction {
        color: #cbd5e1;
        font-size: 14px;
    }

    /* Drop Zone */
    .drop-zone {
        min-height: 105px;
        border: 2px dashed #64748b;
        border-radius: 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
        margin: 20px 0;
        transition: .3s;
        background: rgba(255,255,255,.025);
    }

    .drop-zone.drag-over {
        border-color: #22d3ee;
        background: rgba(34,211,238,.1);
        transform: scale(1.015);
        box-shadow: 0 0 30px rgba(34,211,238,.15);
    }

    .drop-text {
        color: #64748b;
        font-size: 15px;
    }

    /* Numbers */
    .numbers {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 12px;
        margin-top: 15px;
    }

    .number {
        height: 70px;
        border: none;
        border-radius: 20px;
        color: white;
        font-size: 25px;
        font-weight: 900;
        cursor: grab;
        user-select: none;
        touch-action: none;
        background: linear-gradient(135deg, #7c3aed, #2563eb);
        box-shadow:
            0 8px 18px rgba(37,99,235,.25),
            inset 0 1px 0 rgba(255,255,255,.2);
        transition:
            transform .2s ease,
            box-shadow .2s ease,
            opacity .2s ease;
    }

    .number:hover {
        transform: translateY(-7px) scale(1.04);
        box-shadow: 0 15px 30px rgba(37,99,235,.4);
    }

    .number:active {
        cursor: grabbing;
        transform: scale(.92);
    }

    .number.dragging {
        opacity: .4;
        transform: scale(.85);
    }

    .number.correct {
        background: linear-gradient(135deg, #10b981, #22c55e);
        animation: correct .5s ease;
    }

    .number.wrong {
        animation: shake .45s ease;
        background: linear-gradient(135deg, #ef4444, #f97316);
    }

    @keyframes correct {
        50% {
            transform: scale(1.2) rotate(5deg);
        }
    }

    @keyframes shake {
        0%,100% { transform: translateX(0); }
        20% { transform: translateX(-10px); }
        40% { transform: translateX(10px); }
        60% { transform: translateX(-8px); }
        80% { transform: translateX(8px); }
    }

    /* Buttons */
    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 20px;
    }

    button.action {
        flex: 1;
        border: none;
        padding: 15px;
        border-radius: 16px;
        color: white;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: .25s;
    }

    .restart {
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }

    .hint {
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.12) !important;
    }

    button.action:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0,0,0,.25);
    }

    /* Message */
    .message {
        min-height: 30px;
        text-align: center;
        margin-top: 15px;
        font-weight: 700;
        font-size: 16px;
    }

    .success {
        color: #34d399;
    }

    .error {
        color: #fb7185;
    }

    .info {
        color: #67e8f9;
    }

    /* Progress */
    .progress-container {
        height: 8px;
        background: rgba(255,255,255,.08);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 15px;
    }

    .progress {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #22c55e, #06b6d4);
        transition: width 1s linear;
    }

    /* Win overlay */
    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(2,6,23,.8);
        backdrop-filter: blur(12px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 10;
        padding: 20px;
    }

    .overlay.show {
        display: flex;
        animation: fadeIn .4s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .result {
        width: 100%;
        max-width: 430px;
        text-align: center;
        background: #111827;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 30px;
        padding: 35px;
        box-shadow: 0 30px 80px rgba(0,0,0,.5);
        animation: resultPop .5s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes resultPop {
        from {
            transform: scale(.7) translateY(30px);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .result-icon {
        font-size: 65px;
        margin-bottom: 10px;
    }

    .result h2 {
        font-size: 32px;
        margin-bottom: 10px;
    }

    .final-score {
        font-size: 45px;
        font-weight: 900;
        background: linear-gradient(90deg,#a78bfa,#22d3ee);
        -webkit-background-clip: text;
        color: transparent;
        margin: 15px;
    }

    /* Confetti */
    .confetti {
        position: fixed;
        width: 10px;
        height: 18px;
        top: -20px;
        animation: confettiFall 2.5s linear forwards;
        z-index: 20;
    }

    @keyframes confettiFall {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }

    /* Mobile */
    @media(max-width:600px) {
        body {
            padding: 10px;
            align-items: flex-start;
        }

        .game {
            margin-top: 10px;
            padding: 18px;
            border-radius: 24px;
        }

        .stats {
            grid-template-columns: repeat(2, 1fr);
        }

        .numbers {
            grid-template-columns: repeat(3, 1fr);
        }

        .number {
            height: 65px;
        }

        .target {
            width: 150px;
            height: 95px;
            font-size: 48px;
        }

        .buttons {
            flex-direction: column;
        }
    }
</style>
</head>

<body>

<div class="bubble"></div>
<div class="bubble"></div>
<div class="bubble"></div>

<div class="game">

    <header>
        <div class="logo">🎯</div>
        <h1>Tebak Angka</h1>
        <p class="subtitle">
            Drag angka yang benar ke kotak target!
        </p>
    </header>

    <div class="stats">

        <div class="stat">
            <div class="stat-icon">⭐</div>
            <div class="stat-label">SKOR</div>
            <div class="stat-value" id="score">0</div>
        </div>

        <div class="stat">
            <div class="stat-icon">❤️</div>
            <div class="stat-label">NYAWA</div>
            <div class="stat-value" id="lives">3</div>
        </div>

        <div class="stat">
            <div class="stat-icon">🏆</div>
            <div class="stat-label">LEVEL</div>
            <div class="stat-value" id="level">1</div>
        </div>

        <div class="stat">
            <div class="stat-icon">⏱️</div>
            <div class="stat-label">WAKTU</div>
            <div class="stat-value" id="timer">15</div>
        </div>

    </div>

    <div class="progress-container">
        <div class="progress" id="progress"></div>
    </div>

    <div class="target-area">

        <div class="target-label">
            ANGKA TARGET
        </div>

        <div class="target" id="target">
            ?
        </div>

        <div class="instruction">
            Pilih dan tarik angka yang sesuai ke sini 👇
        </div>

    </div>

    <div class="drop-zone" id="dropZone">
        <span class="drop-text">
            🖐️ Lepaskan angka di sini
        </span>
    </div>

    <div class="numbers" id="numbers"></div>

    <div class="message" id="message">
        Cari angka yang sama dengan target!
    </div>

    <div class="buttons">
        <button class="action restart" onclick="restartGame()">
            🔄 Mulai Ulang
        </button>

        <button class="action hint" onclick="showHint()">
            💡 Petunjuk
        </button>
    </div>

</div>

<!-- Result -->
<div class="overlay" id="overlay">

    <div class="result">

        <div class="result-icon" id="resultIcon">
            🎉
        </div>

        <h2 id="resultTitle">
            Hebat!
        </h2>

        <p id="resultText">
            Permainan selesai.
        </p>

        <div class="final-score" id="finalScore">
            0
        </div>

        <p>Skor Akhir</p>

        <br>

        <button class="action restart" onclick="restartGame()">
            🎮 Main Lagi
        </button>

    </div>

</div>

<script>

let score = 0;
let lives = 3;
let level = 1;
let timeLeft = 15;

let targetNumber;
let timerInterval;

const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const timerEl = document.getElementById("timer");
const progressEl = document.getElementById("progress");

const targetEl = document.getElementById("target");
const numbersEl = document.getElementById("numbers");
const dropZone = document.getElementById("dropZone");
const messageEl = document.getElementById("message");

const overlay = document.getElementById("overlay");
const resultIcon = document.getElementById("resultIcon");
const resultTitle = document.getElementById("resultTitle");
const resultText = document.getElementById("resultText");
const finalScore = document.getElementById("finalScore");


// ===============================
// START GAME
// ===============================

function startGame() {

    clearInterval(timerInterval);

    generateRound();

    timerInterval = setInterval(() => {

        timeLeft--;

        updateTimer();

        if (timeLeft <= 0) {
            loseLife("⏰ Waktu habis!");
        }

    }, 1000);
}


// ===============================
// GENERATE ROUND
// ===============================

function generateRound() {

    const maxNumber = Math.min(20 + level * 5, 100);

    targetNumber =
        Math.floor(Math.random() * maxNumber) + 1;

    targetEl.textContent = targetNumber;

    targetEl.classList.remove("pulse");

    setTimeout(() => {
        targetEl.classList.add("pulse");
    }, 10);

    createNumbers(maxNumber);

    timeLeft = Math.max(8, 15 - level);

    updateTimer();

    messageEl.textContent =
        "Cari angka yang sama dengan target!";

    messageEl.className = "message info";
}


// ===============================
// CREATE NUMBERS
// ===============================

function createNumbers(maxNumber) {

    numbersEl.innerHTML = "";

    let values = new Set();

    values.add(targetNumber);

    const totalNumbers = level < 3 ? 9 : 12;

    while (values.size < totalNumbers) {

        let random =
            Math.floor(Math.random() * maxNumber) + 1;

        values.add(random);
    }

    let array = [...values];

    shuffle(array);

    array.forEach(number => {

        const button = document.createElement("button");

        button.className = "number";

        button.textContent = number;

        button.draggable = true;

        button.dataset.number = number;

        // Desktop drag
        button.addEventListener("dragstart", dragStart);

        button.addEventListener("dragend", dragEnd);

        // Mobile touch
        button.addEventListener("pointerdown", pointerDown);

        numbersEl.appendChild(button);

    });
}


// ===============================
// DESKTOP DRAG & DROP
// ===============================

let draggedElement = null;

function dragStart(e) {

    draggedElement = e.currentTarget;

    draggedElement.classList.add("dragging");

    e.dataTransfer.setData(
        "text/plain",
        draggedElement.dataset.number
    );
}

function dragEnd() {

    if (draggedElement) {
        draggedElement.classList.remove("dragging");
    }

    draggedElement = null;
}

dropZone.addEventListener("dragover", e => {

    e.preventDefault();

    dropZone.classList.add("drag-over");

});

dropZone.addEventListener("dragleave", () => {

    dropZone.classList.remove("drag-over");

});

dropZone.addEventListener("drop", e => {

    e.preventDefault();

    dropZone.classList.remove("drag-over");

    if (!draggedElement) return;

    const number =
        Number(draggedElement.dataset.number);

    checkAnswer(number, draggedElement);

});


// ===============================
// MOBILE POINTER DRAG
// ===============================

let touchElement = null;

function pointerDown(e) {

    touchElement = e.currentTarget;

    touchElement.setPointerCapture(e.pointerId);

    const move = event => {

        const rect = dropZone.getBoundingClientRect();

        const inside =
            event.clientX >= rect.left &&
            event.clientX <= rect.right &&
            event.clientY >= rect.top &&
            event.clientY <= rect.bottom;

        dropZone.classList.toggle(
            "drag-over",
            inside
        );
    };

    const up = event => {

        document.removeEventListener(
            "pointermove",
            move
        );

        const rect =
            dropZone.getBoundingClientRect();

        const inside =
            event.clientX >= rect.left &&
            event.clientX <= rect.right &&
            event.clientY >= rect.top &&
            event.clientY <= rect.bottom;

        dropZone.classList.remove("drag-over");

        if (inside) {

            const number =
                Number(touchElement.dataset.number);

            checkAnswer(number, touchElement);

        }

        touchElement = null;
    };

    document.addEventListener(
        "pointermove",
        move
    );

    document.addEventListener(
        "pointerup",
        up,
        {once:true}
    );
}


// ===============================
// CHECK ANSWER
// ===============================

function checkAnswer(number, element) {

    if (number === targetNumber) {

        element.classList.add("correct");

        score += 100 + (timeLeft * 5);

        level++;

        updateStats();

        messageEl.textContent =
            "🎉 Benar! Kamu hebat!";

        messageEl.className =
            "message success";

        createConfetti();

        clearInterval(timerInterval);

        setTimeout(() => {

            startGame();

        }, 700);

    } else {

        element.classList.add("wrong");

        setTimeout(() => {
            element.classList.remove("wrong");
        }, 500);

        loseLife(
            "❌ Salah! Coba angka yang lain."
        );
    }
}


// ===============================
// LOSE LIFE
// ===============================

function loseLife(text) {

    lives--;

    updateStats();

    messageEl.textContent = text;

    messageEl.className =
        "message error";

    timeLeft = 15;

    updateTimer();

    if (lives <= 0) {

        endGame(false);

    }

}


// ===============================
// TIMER
// ===============================

function updateTimer() {

    timerEl.textContent =
        timeLeft;

    const percent =
        (timeLeft / 15) * 100;

    progressEl.style.width =
        percent + "%";
}


// ===============================
// UPDATE STATS
// ===============================

function updateStats() {

    scoreEl.textContent =
        score;

    livesEl.textContent =
        lives;

    levelEl.textContent =
        level;
}


// ===============================
// HINT
// ===============================

function showHint() {

    const buttons =
        document.querySelectorAll(".number");

    buttons.forEach(button => {

        if (
            Number(button.dataset.number)
            === targetNumber
        ) {

            button.style.boxShadow =
                "0 0 30px #22d3ee";

            button.style.transform =
                "scale(1.08)";

            setTimeout(() => {

                button.style.boxShadow = "";

                button.style.transform = "";

            }, 1000);

        }

    });

    score = Math.max(0, score - 25);

    updateStats();

    messageEl.textContent =
        "💡 Petunjuk diberikan! -25 poin";

    messageEl.className =
        "message info";
}


// ===============================
// END GAME
// ===============================

function endGame(win) {

    clearInterval(timerInterval);

    overlay.classList.add("show");

    finalScore.textContent =
        score;

    if (win) {

        resultIcon.textContent =
            "🏆";

        resultTitle.textContent =
            "Luar Biasa!";

        resultText.textContent =
            "Kamu berhasil menyelesaikan permainan!";

        createConfetti();

    } else {

        resultIcon.textContent =
            "😢";

        resultTitle.textContent =
            "Game Over";

        resultText.textContent =
            "Jangan menyerah, coba lagi!";
    }
}


// ===============================
// RESTART
// ===============================

function restartGame() {

    overlay.classList.remove("show");

    score = 0;
    lives = 3;
    level = 1;
    timeLeft = 15;

    updateStats();

    startGame();
}


// ===============================
// SHUFFLE
// ===============================

function shuffle(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


// ===============================
// CONFETTI
// ===============================

function createConfetti() {

    const symbols =
        ["🎉","✨","⭐","💜","💙","🟣"];

    for (let i = 0; i < 30; i++) {

        const confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        confetti.style.left =
            Math.random() * 100 + "vw";

        confetti.style.fontSize =
            (12 + Math.random() * 15) + "px";

        confetti.style.animationDuration =
            (1.5 + Math.random() * 2) + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
            confetti.remove();
        }, 4000);
    }
}


// ===============================
// INITIAL GAME
// ===============================

updateStats();

startGame();

</script>

</body>
</html>
