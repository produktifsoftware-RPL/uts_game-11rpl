<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game XOX</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: 400px;
            max-width: 95%;
            text-align: center;
            background: rgba(15, 23, 42, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-top: 0;
            color: #facc15;
            font-size: 36px;
        }

        .players {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .player {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
        }

        .player1 {
            background: #ef4444;
        }

        .player2 {
            background: #3b82f6;
        }

        .active {
            outline: 4px solid #facc15;
        }

        /* =========================
           SCORE PEMAIN
        ========================= */

        .score-board {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .score-box {
            flex: 1;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 10px;
        }

        .score-title {
            font-size: 13px;
            color: #cbd5e1;
        }

        .score-number {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
        }

        #score1 {
            color: #ef4444;
        }

        #score2 {
            color: #3b82f6;
        }

        #status {
            font-size: 20px;
            margin: 15px 0;
            color: #e2e8f0;
            min-height: 30px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: auto;
        }

        .cell {
            aspect-ratio: 1;
            background: #334155;
            border: none;
            border-radius: 12px;
            font-size: 55px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.15s;
        }

        .cell:hover {
            background: #475569;
            transform: scale(1.03);
        }

        .cell.x {
            color: #ef4444;
        }

        .cell.o {
            color: #3b82f6;
        }

        .winner {
            background: #facc15 !important;
            color: #111827 !important;
        }

        /* =========================
           TOMBOL
        ========================= */

        .buttons {
            margin-top: 20px;
        }

        button#restart,
        button#resetScore {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 4px;
        }

        button#restart {
            background: #22c55e;
        }

        button#restart:hover {
            background: #16a34a;
        }

        button#resetScore {
            background: #ef4444;
        }

        button#resetScore:hover {
            background: #dc2626;
        }

        .rules {
            margin-top: 15px;
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>❌ XOX ⭕</h1>


    <!-- PEMAIN -->

    <div class="players">

        <div id="player1" class="player player1">
            🔴 Pemain 1<br>
            X
        </div>

        <div id="player2" class="player player2">
            🔵 Pemain 2<br>
            O
        </div>

    </div>


    <!-- SCORE -->

    <div class="score-board">

        <div class="score-box">

            <div class="score-title">
                SKOR PEMAIN 1
            </div>

            <div id="score1" class="score-number">
                0
            </div>

        </div>


        <div class="score-box">

            <div class="score-title">
                SKOR PEMAIN 2
            </div>

            <div id="score2" class="score-number">
                0
            </div>

        </div>

    </div>


    <!-- STATUS -->

    <div id="status">
        Giliran Pemain 1 (X)
    </div>


    <!-- PAPAN XOX -->

    <div id="board">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>


    <!-- TOMBOL -->

    <div class="buttons">

        <button id="restart" onclick="restartGame()">
            🔄 Ronde Baru
        </button>

        <button id="resetScore" onclick="resetScore()">
            🗑️ Reset Skor
        </button>

    </div>


    <div class="rules">

        Buat 3 simbol yang sama secara horizontal,
        vertikal, atau diagonal untuk menang.

    </div>

</div>


<script>

const cells = document.querySelectorAll(".cell");

const statusText = document.getElementById("status");

const player1Box = document.getElementById("player1");

const player2Box = document.getElementById("player2");

const score1Text = document.getElementById("score1");

const score2Text = document.getElementById("score2");


/* =========================
   DATA PERMAINAN
========================= */

let board = [
    "", "", "",
    "", "", "",
    "", "", ""
];

let currentPlayer = "X";

let gameActive = true;


/* =========================
   SCORE PEMAIN
========================= */

let score1 = 0;

let score2 = 0;


/* =========================
   KOMBINASI KEMENANGAN
========================= */

const winningCombinations = [

    [0, 1, 2],
    [3, 4, 5],
    [6, 7, 8],

    [0, 3, 6],
    [1, 4, 7],
    [2, 5, 8],

    [0, 4, 8],
    [2, 4, 6]

];


/* =========================
   KLIK KOTAK
========================= */

cells.forEach(cell => {

    cell.addEventListener("click", function() {

        const index = this.getAttribute("data-index");


        /* 
           Jangan izinkan memilih
           kotak yang sudah terisi
        */

        if (board[index] !== "" || !gameActive) {
            return;
        }


        /* Masukkan simbol */

        board[index] = currentPlayer;

        this.textContent = currentPlayer;


        /* Warna X dan O */

        if (currentPlayer === "X") {

            this.classList.add("x");

        } else {

            this.classList.add("o");

        }


        /* Cek kemenangan */

        checkWinner();

    });

});


/* =========================
   CEK PEMENANG
========================= */

function checkWinner() {

    for (let combination of winningCombinations) {

        const a = combination[0];

        const b = combination[1];

        const c = combination[2];


        if (
            board[a] !== "" &&
            board[a] === board[b] &&
            board[a] === board[c]
        ) {


            /* Tandai kotak pemenang */

            cells[a].classList.add("winner");

            cells[b].classList.add("winner");

            cells[c].classList.add("winner");


            /* =========================
               TAMBAHKAN SKOR
            ========================= */

            if (currentPlayer === "X") {

                score1++;

            } else {

                score2++;

            }


            /* Update tampilan skor */

            updateScore();


            /* Tampilkan pemenang */

            if (currentPlayer === "X") {

                statusText.textContent =
                    "🏆 Pemain 1 MENANG!";

            } else {

                statusText.textContent =
                    "🏆 Pemain 2 MENANG!";

            }


            /* Hentikan permainan */

            gameActive = false;

            return;

        }

    }


    /* =========================
       CEK SERI
    ========================= */

    if (!board.includes("")) {

        statusText.textContent =
            "🤝 Permainan SERI!";

        gameActive = false;

        return;

    }


    /* =========================
       GANTI PEMAIN
    ========================= */

    if (currentPlayer === "X") {

        currentPlayer = "O";

        statusText.textContent =
            "Giliran Pemain 2 (O)";

    } else {

        currentPlayer = "X";

        statusText.textContent =
            "Giliran Pemain 1 (X)";

    }


    updateActivePlayer();

}


/* =========================
   UPDATE SCORE
========================= */

function updateScore() {

    score1Text.textContent = score1;

    score2Text.textContent = score2;

}


/* =========================
   PEMAIN AKTIF
========================= */

function updateActivePlayer() {

    player1Box.classList.remove("active");

    player2Box.classList.remove("active");


    if (currentPlayer === "X") {

        player1Box.classList.add("active");

    } else {

        player2Box.classList.add("active");

    }

}


/* =========================
   RONDE BARU
========================= */

function restartGame() {

    /* Kosongkan papan */

    board = [
        "", "", "",
        "", "", "",
        "", "", ""
    ];


    /* Pemain 1 mulai */

    currentPlayer = "X";


    /* Aktifkan permainan */

    gameActive = true;


    /* Status */

    statusText.textContent =
        "Giliran Pemain 1 (X)";


    /* Bersihkan semua kotak */

    cells.forEach(cell => {

        cell.textContent = "";

        cell.classList.remove("x");

        cell.classList.remove("o");

        cell.classList.remove("winner");

    });


    updateActivePlayer();

}


/* =========================
   RESET SKOR
========================= */

function resetScore() {

    score1 = 0;

    score2 = 0;


    /* Update tampilan */

    updateScore();


    /* Mulai ronde baru */

    restartGame();

}


/* =========================
   JALANKAN SAAT PERTAMA
   KALI HALAMAN DIBUKA
========================= */

updateActivePlayer();

updateScore();

</script>

</body>
</html>
