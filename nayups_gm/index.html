<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>🌈 Color Rush</title>

<link
 href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
 rel="stylesheet">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  font-family:system-ui,sans-serif;
  color:white;

  background:
    radial-gradient(circle at 10% 20%,#ff00cc33,transparent 30%),
    radial-gradient(circle at 90% 30%,#00e5ff33,transparent 30%),
    radial-gradient(circle at 50% 100%,#7c3aed44,transparent 40%),
    #070816;
}

.game{
  width:min(1100px,96vw);
  margin:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:15px 0;
}

.logo{
  font-size:clamp(22px,5vw,38px);
  font-weight:900;

  background:
    linear-gradient(
      90deg,
      #ff4ecd,
      #7c3aed,
      #00e5ff,
      #00ff88
    );

  -webkit-background-clip:text;
  color:transparent;
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.stat{
  min-width:90px;
  padding:8px 12px;

  border:1px solid #ffffff18;
  border-radius:14px;

  background:#ffffff0b;
  backdrop-filter:blur(10px);

  text-align:center;
}

.stat small{
  display:block;
  color:#94a3b8;
}

.stat strong{
  font-size:20px;
}

#game{
  position:relative;

  width:100%;
  height:min(72vh,650px);

  border-radius:28px;

  overflow:hidden;

  background:#080b1d;

  border:1px solid #ffffff18;

  box-shadow:
    0 30px 80px #0008,
    inset 0 0 80px #ffffff05;
}

canvas{
  width:100%;
  height:100%;

  display:block;

  touch-action:none;
}

.message{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  opacity:0;

  pointer-events:none;

  text-align:center;

  font-size:clamp(30px,8vw,70px);

  font-weight:900;

  text-shadow:
    0 0 20px currentColor,
    0 0 50px currentColor;

  transition:.25s;
}

.message.show{
  opacity:1;
  transform:
    translate(-50%,-50%)
    scale(1);
}

.controls{
  margin-top:12px;

  display:flex;
  justify-content:center;
  gap:10px;
}

.btn-game{
  border:0;
  color:white;

  font-weight:800;

  padding:10px 25px;

  border-radius:14px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  box-shadow:
    0 8px 25px #7c3aed55;
}

.btn-game:hover{
  color:white;
  transform:translateY(-2px);
}

.tip{
  text-align:center;
  color:#64748b;
  margin-top:8px;
  font-size:13px;
}

</style>
</head>

<body>

<div class="game">

  <div class="header">

    <div>
      <div class="logo">
        🌈 COLOR RUSH
      </div>

      <div class="text-secondary small">
        Drag • Match • Combo • Explode
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <small>SCORE</small>
        <strong id="score">0</strong>
      </div>

      <div class="stat">
        <small>COMBO</small>
        <strong id="combo">x1</strong>
      </div>

      <div class="stat">
        <small>TIME</small>
        <strong id="time">60</strong>
      </div>

    </div>

  </div>


  <div id="game">

    <canvas id="canvas"></canvas>

    <div
      id="message"
      class="message">
    </div>

  </div>


  <div class="controls">

    <button
      id="start"
      class="btn-game">
      🚀 START GAME
    </button>

  </div>

  <div class="tip">
    🫳 Drag bola ke portal dengan warna yang sama
  </div>

</div>


<script>

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const gameBox =
  document.getElementById("game");

const scoreEl =
  document.getElementById("score");

const comboEl =
  document.getElementById("combo");

const timeEl =
  document.getElementById("time");

const message =
  document.getElementById("message");

const startBtn =
  document.getElementById("start");


let W,H,DPR;

let running=false;

let score=0;
let combo=1;
let time=60;

let lastTime=0;

let dragged=null;

let balls=[];
let targets=[];
let particles=[];
let stars=[];

const colors=[
  "#ff3cac",
  "#7c3aed",
  "#00e5ff",
  "#00ff88",
  "#ffd166",
  "#ff5e5e"
];


/* =========================
   RESIZE
========================= */

function resize(){

  const rect =
    canvas.getBoundingClientRect();

  W=rect.width;
  H=rect.height;

  DPR=
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width=W*DPR;
  canvas.height=H*DPR;

  ctx.setTransform(
    DPR,0,0,DPR,0,0
  );

  createStars();

}

window.addEventListener(
  "resize",
  resize
);


/* =========================
   RANDOM
========================= */

function random(min,max){

  return Math.random()*
    (max-min)+min;

}


/* =========================
   STAR FIELD
========================= */

function createStars(){

  stars=[];

  for(let i=0;i<70;i++){

    stars.push({

      x:random(0,W),
      y:random(0,H),

      r:random(.5,2),

      speed:random(.1,.5),

      alpha:random(.2,.8)

    });

  }

}


/* =========================
   BALL
========================= */

class Ball{

  constructor(color){

    this.color=color;

    this.r=random(
      18,
      27
    );

    this.x=random(
      this.r,
      W-this.r
    );

    this.y=random(
      this.r,
      H-this.r
    );

    this.tx=this.x;
    this.ty=this.y;

    this.rotation=
      random(0,Math.PI*2);

    this.pulse=
      random(0,Math.PI*2);

  }

  update(dt){

    this.x +=
      (this.tx-this.x)*
      (this===dragged?.ball?.3:.08);

    this.y +=
      (this.ty-this.y)*
      (this===dragged?.ball?.3:.08);

    this.rotation+=
      dt*.002;

    this.pulse+=
      dt*.004;

  }

  draw(){

    const pulse=
      Math.sin(this.pulse)*2;

    ctx.save();

    ctx.translate(
      this.x,
      this.y
    );

    ctx.rotate(
      this.rotation
    );

    /* glow */

    ctx.shadowColor=
      this.color;

    ctx.shadowBlur=
      dragged?.ball===this
      ? 35
      : 20;

    const g=
      ctx.createRadialGradient(
        -this.r*.3,
        -this.r*.3,
        1,
        0,
        0,
        this.r+5
      );

    g.addColorStop(
      0,
      "#ffffff"
    );

    g.addColorStop(
      .15,
      this.color
    );

    g.addColorStop(
      1,
      this.color+"22"
    );

    ctx.fillStyle=g;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      this.r+pulse,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* shine */

    ctx.shadowBlur=0;

    ctx.fillStyle="#ffffff66";

    ctx.beginPath();

    ctx.arc(
      -this.r*.35,
      -this.r*.35,
      this.r*.2,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  }

}


/* =========================
   TARGET
========================= */

class Target{

  constructor(color){

    this.color=color;

    this.x=random(
      60,
      W-60
    );

    this.y=random(
      60,
      H-60
    );

    this.baseR=
      random(32,42);

    this.phase=
      random(0,Math.PI*2);

  }

  update(dt){

    this.phase+=
      dt*.003;

  }

  draw(){

    const r=
      this.baseR+
      Math.sin(this.phase)*5;

    ctx.save();

    ctx.translate(
      this.x,
      this.y
    );

    ctx.rotate(
      this.phase*.3
    );

    ctx.strokeStyle=
      this.color;

    ctx.lineWidth=3;

    ctx.shadowColor=
      this.color;

    ctx.shadowBlur=25;

    ctx.globalAlpha=.9;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.globalAlpha=.12;

    ctx.fillStyle=
      this.color;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

    /* inner */

    ctx.globalAlpha=.8;

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      r*.55,
      0,
      Math.PI*2
    );

    ctx.stroke();

    ctx.restore();

  }

}


/* =========================
   PARTICLES
========================= */

function explode(
  x,
  y,
  color,
  amount=35
){

  for(
    let i=0;
    i<amount;
    i++
  ){

    const angle=
      random(0,Math.PI*2);

    const speed=
      random(1,6);

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle)*speed,

      vy:
        Math.sin(angle)*speed,

      size:
        random(2,6),

      life:1,

      color

    });

  }

}


function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.vy+=.08;

    p.life-=.025;

    if(p.life<=0){

      particles.splice(i,1);

    }

  }

}


function drawParticles(){

  particles.forEach(p=>{

    ctx.save();

    ctx.globalAlpha=
      p.life;

    ctx.fillStyle=
      p.color;

    ctx.shadowColor=
      p.color;

    ctx.shadowBlur=12;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.restore();

  });

}


/* =========================
   LEVEL
========================= */

function createLevel(){

  balls=[];
  targets=[];

  const count=
    Math.min(
      5,
      Math.max(
        3,
        Math.floor(W/170)
      )
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const color=
      colors[
        Math.floor(
          Math.random()*
          colors.length
        )
      ];

    balls.push(
      new Ball(color)
    );

    const target=
      new Target(color);

    targets.push(target);

  }

}


/* =========================
   POINTER
========================= */

function pointerPosition(e){

  const rect=
    canvas.getBoundingClientRect();

  return {

    x:
      e.clientX-
      rect.left,

    y:
      e.clientY-
      rect.top

  };

}


canvas.addEventListener(
  "pointerdown",
  e=>{

    if(!running)return;

    const p=
      pointerPosition(e);

    for(
      let i=balls.length-1;
      i>=0;
      i--
    ){

      const b=balls[i];

      const dx=
        p.x-b.x;

      const dy=
        p.y-b.y;

      if(
        Math.hypot(dx,dy)
        <
        b.r+12
      ){

        dragged={

          ball:b,

          offsetX:dx,

          offsetY:dy

        };

        canvas.setPointerCapture(
          e.pointerId
        );

        break;

      }

    }

  }
);


canvas.addEventListener(
  "pointermove",
  e=>{

    if(!dragged)return;

    const p=
      pointerPosition(e);

    const b=
      dragged.ball;

    b.tx=
      p.x-
      dragged.offsetX;

    b.ty=
      p.y-
      dragged.offsetY;

  }
);


canvas.addEventListener(
  "pointerup",
  e=>{

    if(!dragged)return;

    const b=
      dragged.ball;

    let matched=false;

    for(
      const target of targets
    ){

      if(
        target.color!==b.color
      )continue;

      const distance=
        Math.hypot(
          b.x-target.x,
          b.y-target.y
        );

      if(
        distance<
        b.r+target.baseR*.7
      ){

        matched=true;

        score +=
          10*combo;

        combo++;

        scoreEl.textContent=
          score;

        comboEl.textContent=
          "x"+combo;

        explode(
          target.x,
          target.y,
          b.color,
          55
        );

        showMessage(
          "✨ PERFECT!",
          b.color
        );

        /*
          Pindahkan target
        */

        target.x=
          random(
            50,
            W-50
          );

        target.y=
          random(
            50,
            H-50
          );

        /*
          Respawn bola
        */

        b.tx=
          random(
            b.r,
            W-b.r
          );

        b.ty=
          random(
            b.r,
            H-b.r
          );

        break;

      }

    }


    if(!matched){

      combo=1;

      comboEl.textContent=
        "x1";

    }

    dragged=null;

  }
);


/* =========================
   MESSAGE
========================= */

let messageTimer;

function showMessage(
  text,
  color
){

  message.textContent=
    text;

  message.style.color=
    color;

  message.classList.add(
    "show"
  );

  clearTimeout(
    messageTimer
  );

  messageTimer=
    setTimeout(
      ()=>{
        message.classList.remove(
          "show"
        );
      },
      500
    );

}


/* =========================
   BACKGROUND
========================= */

function drawBackground(){

  const g=
    ctx.createLinearGradient(
      0,0,W,H
    );

  g.addColorStop(
    0,
    "#08091b"
  );

  g.addColorStop(
    .5,
    "#111330"
  );

  g.addColorStop(
    1,
    "#050617"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,0,W,H
  );


  stars.forEach(s=>{

    s.y+=s.speed;

    if(s.y>H)
      s.y=0;

    ctx.globalAlpha=
      s.alpha;

    ctx.fillStyle=
      "#ffffff";

    ctx.beginPath();

    ctx.arc(
      s.x,
      s.y,
      s.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  });

  ctx.globalAlpha=1;

}


/* =========================
   GAME LOOP
========================= */

function loop(timestamp){

  requestAnimationFrame(
    loop
  );

  const dt=
    timestamp-lastTime;

  lastTime=timestamp;

  drawBackground();


  targets.forEach(
    t=>{
      t.update(dt);
      t.draw();
    }
  );


  balls.forEach(
    b=>{
      b.update(dt);
      b.draw();
    }
  );


  updateParticles();

  drawParticles();


  if(running){

    time -=
      dt/1000;

    if(time<=0){

      time=0;

      endGame();

    }

    timeEl.textContent=
      Math.ceil(time);

  }

}


/* =========================
   START
========================= */

function startGame(){

  score=0;
  combo=1;
  time=60;

  scoreEl.textContent=
    "0";

  comboEl.textContent=
    "x1";

  timeEl.textContent=
    "60";

  particles=[];

  createLevel();

  running=true;

  startBtn.textContent=
    "🔄 RESTART";

  showMessage(
    "GO! 🔥",
    "#00e5ff"
  );

}


/* =========================
   END
========================= */

function endGame(){

  running=false;

  showMessage(
    "🏆 "+score,
    "#ffd166"
  );

  explode(
    W/2,
    H/2,
    "#ffd166",
    120
  );

}


/* =========================
   BUTTON
========================= */

startBtn.addEventListener(
  "click",
  startGame
);


/* =========================
   INIT
========================= */

resize();

createLevel();

requestAnimationFrame(
  loop
);

</script>

</body>
</html>
