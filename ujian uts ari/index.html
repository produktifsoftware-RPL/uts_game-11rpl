<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Racing Multiplayer</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;
    background:#05070d;
    font-family:Arial,sans-serif;
    color:white;
    user-select:none;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#hud{
    position:fixed;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;

    min-width:330px;
    padding:12px 20px;

    text-align:center;

    background:rgba(5,10,25,.78);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;

    backdrop-filter:blur(12px);
    box-shadow:0 10px 40px rgba(0,0,0,.45);
}

#title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:8px;
}

#scores{
    font-size:14px;
    font-weight:bold;
}

#info{
    margin-top:7px;
    font-size:11px;
    opacity:.65;
}

#gameOver{
    display:none;
    position:fixed;
    inset:0;
    z-index:20;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.78);
    backdrop-filter:blur(8px);
}

.panel{
    width:min(90%,500px);
    padding:35px;

    text-align:center;

    background:rgba(8,13,30,.96);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;

    box-shadow:0 0 80px rgba(0,120,255,.25);
}

.panel h1{
    color:#ff3b6b;
    font-size:45px;
    text-shadow:0 0 25px #ff3b6b;
    margin-bottom:15px;
}

#winner{
    font-size:21px;
    margin-bottom:25px;
}

button{
    padding:13px 30px;
    border:0;
    border-radius:12px;

    color:white;
    background:linear-gradient(135deg,#00c6ff,#0066ff);

    font-size:16px;
    font-weight:bold;
    cursor:pointer;

    box-shadow:0 8px 25px rgba(0,120,255,.35);
    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}
</style>
</head>

<body>

<div id="hud">

    <div id="title">🏁 NEON RACING</div>

    <div id="scores"></div>

    <div id="info">
        P1 WASD |
        P2 ARROW |
        P3 IJKL |
        P4 TFGH |
        SPACE = NITRO
    </div>

</div>

<canvas id="game"></canvas>

<div id="gameOver">

    <div class="panel">

        <h1>GAME OVER</h1>

        <div id="winner"></div>

        <button onclick="restartGame()">
            BALAP LAGI
        </button>

    </div>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){

    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;

}

resize();

window.addEventListener("resize",resize);


/* =========================
   KEYBOARD
========================= */

const keys = {};

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

});

window.addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()] = false;

});


/* =========================
   GAME VARIABLES
========================= */

let players = [];
let obstacles = [];

let roadOffset = 0;
let distance = 0;

let gameRunning = true;

let spawnTimer = 0;


/* =========================
   PLAYER
========================= */

function createPlayer(
    name,
    color,
    x,
    controls
){

    return {

        name:name,

        color:color,

        x:x,

        targetX:x,

        y:H-150,

        width:38,

        height:70,

        speed:5,

        score:0,

        nitro:100,

        alive:true,

        controls:controls,

        angle:0,

        bounce:0

    };

}


/* =========================
   START
========================= */

function startGame(){

    const center = W/2;

    players=[

        createPlayer(
            "P1",
            "#00e5ff",
            center-90,
            {
                up:"w",
                down:"s",
                left:"a",
                right:"d"
            }
        ),

        createPlayer(
            "P2",
            "#ff3b6b",
            center-30,
            {
                up:"arrowup",
                down:"arrowdown",
                left:"arrowleft",
                right:"arrowright"
            }
        ),

        createPlayer(
            "P3",
            "#a855f7",
            center+30,
            {
                up:"i",
                down:"k",
                left:"j",
                right:"l"
            }
        ),

        createPlayer(
            "P4",
            "#ffe600",
            center+90,
            {
                up:"t",
                down:"g",
                left:"f",
                right:"h"
            }
        )

    ];

    obstacles=[];

    distance=0;

    roadOffset=0;

    spawnTimer=0;

    gameRunning=true;

    document.getElementById(
        "gameOver"
    ).style.display="none";

}


/* =========================
   ROAD
========================= */

function roadWidth(){

    return Math.min(700,W*.72);

}

function roadLeft(){

    return W/2-roadWidth()/2;

}


/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(p){

    if(!p.alive)
        return;


    const c=p.controls;

    let dx=0;

    if(keys[c.left])
        dx--;

    if(keys[c.right])
        dx++;


    const normalSpeed=5;

    let currentSpeed=normalSpeed;


    /* NITRO */

    if(
        keys[" "] &&
        p.nitro>0
    ){

        currentSpeed=9;

        p.nitro-=0.8;

    }else{

        p.nitro=Math.min(
            100,
            p.nitro+0.12
        );

    }


    p.targetX += dx*currentSpeed*1.5;


    const left =
        roadLeft()+20;

    const right =
        roadLeft()+roadWidth()-20;


    p.targetX =
        Math.max(
            left,
            Math.min(
                right,
                p.targetX
            )
        );


    /* SMOOTH MOVEMENT */

    p.x +=
        (p.targetX-p.x)*.18;


    /* CAR TILT */

    const tilt =
        (p.targetX-p.x)*.02;

    p.angle +=
        (tilt-p.angle)*.2;


    p.bounce += .15;


    p.score += currentSpeed*.01;

}


/* =========================
   OBSTACLES
========================= */

function spawnObstacle(){

    const roadL=roadLeft();
    const width=roadWidth();

    const laneWidth=width/5;

    const lane=
        Math.floor(
            Math.random()*5
        );

    obstacles.push({

        x:
            roadL+
            laneWidth*lane+
            laneWidth/2,

        y:-80,

        width:40,

        height:65,

        speed:
            3+
            Math.random()*2,

        color:[
            "#ff5733",
            "#00d4ff",
            "#ffea00",
            "#a855f7"
        ][
            Math.floor(
                Math.random()*4
            )
        ],

        rotation:0

    });

}


/* =========================
   COLLISION
========================= */

function collision(a,b){

    return (

        Math.abs(a.x-b.x)
        <
        (a.width+b.width)/2

        &&

        Math.abs(a.y-b.y)
        <
        (a.height+b.height)/2

    );

}


/* =========================
   UPDATE
========================= */

function update(){

    if(!gameRunning)
        return;


    roadOffset += 8;

    distance += .1;


    players.forEach(updatePlayer);


    /* SPAWN */

    spawnTimer++;

    if(spawnTimer>35){

        spawnObstacle();

        spawnTimer=0;

    }


    /* OBSTACLES */

    obstacles.forEach(o=>{

        o.y += o.speed+3;

        o.rotation += .03;

    });


    /* COLLISIONS */

    players.forEach(p=>{

        if(!p.alive)
            return;


        obstacles.forEach(o=>{

            if(collision(p,o)){

                p.alive=false;

            }

        });


        /* PLAYER VS PLAYER */

        players.forEach(other=>{

            if(
                other!==p &&
                other.alive &&
                collision(p,other)
            ){

                p.alive=false;

            }

        });

    });


    obstacles =
        obstacles.filter(
            o=>o.y<H+100
        );


    /* GAME OVER */

    const alive =
        players.filter(
            p=>p.alive
        );


    if(alive.length<=1){

        gameRunning=false;

        let winner;

        if(alive.length===1){

            winner =
                alive[0].name+
                " MENANG! 🏆";

        }else{

            winner=
                "SEMUA MOBIL HANCUR!";

        }

        document.getElementById(
            "winner"
        ).textContent=winner;


        setTimeout(()=>{

            document.getElementById(
                "gameOver"
            ).style.display="flex";

        },500);

    }


    updateScores();

}


/* =========================
   SCORE UI
========================= */

function updateScores(){

    document.getElementById(
        "scores"
    ).innerHTML=

        players.map(p=>`

            <span style="
                color:${p.color};
                margin:0 5px;
            ">

                ${p.name}:
                ${Math.floor(p.score)}

                ${
                    p.alive
                    ? "🏎️"
                    : "💥"
                }

            </span>

        `).join(" | ");

}


/* =========================
   DRAW ROAD
========================= */

function drawRoad(){

    const rw=roadWidth();
    const rl=roadLeft();


    /* GRASS */

    const grass=
        ctx.createLinearGradient(
            0,0,0,H
        );

    grass.addColorStop(
        0,
        "#087a3d"
    );

    grass.addColorStop(
        1,
        "#032c19"
    );

    ctx.fillStyle=grass;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ROAD */

    const road=
        ctx.createLinearGradient(
            rl,
            0,
            rl+rw,
            0
        );

    road.addColorStop(
        0,
        "#141820"
    );

    road.addColorStop(
        .5,
        "#242932"
    );

    road.addColorStop(
        1,
        "#141820"
    );

    ctx.fillStyle=road;

    ctx.fillRect(
        rl,
        0,
        rw,
        H
    );


    /* ROAD EDGES */

    ctx.fillStyle="#eeeeee";

    ctx.fillRect(
        rl,
        0,
        6,
        H
    );

    ctx.fillRect(
        rl+rw-6,
        0,
        6,
        H
    );


    /* LANE LINES */

    const laneWidth=rw/5;

    ctx.fillStyle=
        "rgba(255,255,255,.7)";


    for(
        let lane=1;
        lane<5;
        lane++
    ){

        const x=
            rl+
            laneWidth*lane;

        for(
            let y=-60+
                (roadOffset%80);
            y<H;
            y+=80
        ){

            ctx.fillRect(
                x-2,
                y,
                4,
                45
            );

        }

    }

}


/* =========================
   DRAW CAR
========================= */

function drawCar(p){

    ctx.save();


    const bob=
        Math.sin(p.bounce)*1.5;


    ctx.translate(
        p.x,
        p.y+bob
    );

    ctx.rotate(p.angle);


    /* SHADOW */

    ctx.fillStyle=
        "rgba(0,0,0,.4)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        5,
        25,
        42,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* NITRO FLAME */

    if(
        keys[" "] &&
        p.nitro>0 &&
        p.alive
    ){

        ctx.shadowBlur=20;
        ctx.shadowColor="#00eaff";

        const flame=
            ctx.createLinearGradient(
                0,
                35,
                0,
                65
            );

        flame.addColorStop(
            0,
            "#ffffff"
        );

        flame.addColorStop(
            .4,
            "#00eaff"
        );

        flame.addColorStop(
            1,
            "transparent"
        );

        ctx.fillStyle=flame;

        ctx.beginPath();

        ctx.moveTo(-9,32);
        ctx.lineTo(0,65);
        ctx.lineTo(9,32);

        ctx.closePath();

        ctx.fill();

    }


    /* CAR GLOW */

    ctx.shadowBlur=22;
    ctx.shadowColor=p.color;


    /* BODY */

    ctx.fillStyle=p.color;

    roundRect(
        ctx,
        -19,
        -35,
        38,
        70,
        9
    );

    ctx.fill();


    /* WINDOWS */

    ctx.shadowBlur=0;

    ctx.fillStyle=
        "rgba(5,15,30,.9)";


    roundRect(
        ctx,
        -13,
        -22,
        26,
        20,
        5
    );

    ctx.fill();


    /* WINDOW REFLECTION */

    ctx.fillStyle=
        "rgba(255,255,255,.22)";

    ctx.fillRect(
        -10,
        -19,
        20,
        3
    );


    /* HEADLIGHTS */

    ctx.fillStyle="#ffffff";

    ctx.shadowBlur=10;
    ctx.shadowColor="#ffffff";

    ctx.fillRect(
        -14,
        -31,
        7,
        4
    );

    ctx.fillRect(
        7,
        -31,
        7,
        4
    );


    /* WHEELS */

    ctx.shadowBlur=0;

    ctx.fillStyle="#080808";

    ctx.fillRect(
        -23,
        -22,
        7,
        18
    );

    ctx.fillRect(
        16,
        -22,
        7,
        18
    );

    ctx.fillRect(
        -23,
        7,
        7,
        18
    );

    ctx.fillRect(
        16,
        7,
        7,
        18
    );


    /* DEAD EFFECT */

    if(!p.alive){

        ctx.fillStyle=
            "rgba(255,255,255,.8)";

        ctx.font=
            "bold 18px Arial";

        ctx.textAlign="center";

        ctx.fillText(
            "💥",
            0,
            7
        );

    }


    ctx.restore();


    /* PLAYER NAME */

    ctx.font=
        "bold 12px Arial";

    ctx.textAlign="center";

    ctx.fillStyle="white";

    ctx.fillText(
        p.name,
        p.x,
        p.y-48
    );

}


/* =========================
   DRAW OBSTACLE
========================= */

function drawObstacle(o){

    ctx.save();

    ctx.translate(
        o.x,
        o.y
    );

    ctx.rotate(
        Math.sin(o.rotation)*.05
    );


    ctx.shadowBlur=15;
    ctx.shadowColor=o.color;

    ctx.fillStyle=o.color;

    roundRect(
        ctx,
        -20,
        -32,
        40,
        64,
        8
    );

    ctx.fill();


    ctx.shadowBlur=0;

    /* WINDOW */

    ctx.fillStyle=
        "rgba(0,0,0,.7)";

    roundRect(
        ctx,
        -13,
        -18,
        26,
        18,
        4
    );

    ctx.fill();


    /* STRIPE */

    ctx.fillStyle=
        "rgba(255,255,255,.35)";

    ctx.fillRect(
        -3,
        -32,
        6,
        64
    );


    ctx.restore();

}


/* =========================
   ROUND RECT
========================= */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.lineTo(
        x+w-r,
        y
    );

    ctx.quadraticCurveTo(
        x+w,
        y,
        x+w,
        y+r
    );

    ctx.lineTo(
        x+w,
        y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,
        y+h,
        x+w-r,
        y+h
    );

    ctx.lineTo(
        x+r,
        y+h
    );

    ctx.quadraticCurveTo(
        x,
        y+h,
        x,
        y+h-r
    );

    ctx.lineTo(
        x,
        y+r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x+r,
        y
    );

    ctx.closePath();

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawRoad();


    obstacles.forEach(
        drawObstacle
    );


    players.forEach(
        drawCar
    );

}


/* =========================
   GAME LOOP
========================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


/* =========================
   RESTART
========================= */

function restartGame(){

    startGame();

}


/* START */

startGame();

loop();

</script>

</body>
</html>
