<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEON CHESS</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;

    background:
        radial-gradient(circle at 15% 15%,#ff2da633,transparent 30%),
        radial-gradient(circle at 85% 20%,#00e5ff33,transparent 30%),
        radial-gradient(circle at 50% 100%,#7c3aed44,transparent 40%),
        #050716;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.app{
    width:min(1100px,100%);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:15px;
}

.logo{
    font-size:clamp(25px,5vw,45px);
    font-weight:1000;
    letter-spacing:2px;

    background:
        linear-gradient(
            90deg,
            #00e5ff,
            #7c3aed,
            #ff2da6,
            #00ff9d
        );

    -webkit-background-clip:text;
    color:transparent;
}

.sub{
    color:#94a3b8;
    margin-top:3px;
}

.status{
    padding:10px 18px;
    border-radius:15px;

    background:#ffffff0c;
    border:1px solid #ffffff18;

    backdrop-filter:blur(15px);

    text-align:center;
}

.status small{
    display:block;
    color:#94a3b8;
    font-size:10px;
}

.status strong{
    color:#00e5ff;
    font-size:18px;
}

.layout{
    display:grid;
    grid-template-columns:minmax(0,760px) 250px;
    gap:20px;
}

.board-wrap{
    padding:12px;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #ffffff14,
            #ffffff04
        );

    border:1px solid #ffffff1c;

    box-shadow:
        0 30px 80px #0008,
        0 0 50px #7c3aed22;

    backdrop-filter:blur(15px);
}

#board{
    width:100%;
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(8,1fr);
    overflow:hidden;
    border-radius:15px;
}

.square{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    user-select:none;

    transition:
        background .18s ease,
        transform .18s ease;
}

.square.light{
    background:#1d3153;
}

.square.dark{
    background:#111d36;
}

.square:hover{
    filter:brightness(1.3);
}

.square.selected{
    background:#7c3aed !important;
    box-shadow:
        inset 0 0 0 4px #d8b4fe,
        inset 0 0 35px #c084fc99;
}

.square.last{
    background:#0ea5e933;
}

.square.check{
    background:#ef4444aa !important;
    box-shadow:
        inset 0 0 40px #ff000099;
}

.move-dot{
    position:absolute;

    width:22%;
    aspect-ratio:1;

    border-radius:50%;

    background:#00ffcc;

    box-shadow:
        0 0 12px #00ffcc,
        0 0 30px #00ffcc88;

    pointer-events:none;
}

.capture-ring{
    position:absolute;

    inset:8%;

    border-radius:50%;

    border:4px solid #ff2da6;

    box-shadow:
        0 0 15px #ff2da6,
        inset 0 0 15px #ff2da6;

    pointer-events:none;
}

.piece{
    position:relative;
    z-index:3;

    font-size:clamp(30px,7vw,70px);

    line-height:1;

    cursor:pointer;

    filter:
        drop-shadow(0 5px 4px #0008)
        drop-shadow(0 0 10px currentColor);

    transition:
        transform .18s cubic-bezier(.2,.8,.2,1),
        filter .18s ease;
}

.square:hover .piece{
    transform:
        translateY(-5px)
        scale(1.06);
}

.white-piece{
    color:#f8fbff;

    text-shadow:
        0 0 3px #fff,
        0 0 12px #00e5ff,
        2px 3px 3px #000;
}

.black-piece{
    color:#ff4fb3;

    text-shadow:
        0 0 4px #ff2da6,
        0 0 15px #ff2da688,
        2px 3px 3px #000;
}

.sidebar{
    padding:18px;

    border-radius:20px;

    background:#ffffff08;

    border:1px solid #ffffff15;

    backdrop-filter:blur(15px);
}

.player{
    padding:14px;

    border-radius:15px;

    background:#ffffff08;

    margin-bottom:12px;
}

.player.active{
    border:1px solid #00e5ff88;

    box-shadow:
        0 0 25px #00e5ff22;
}

.player-name{
    font-weight:900;
}

.player-color{
    color:#94a3b8;
    font-size:12px;
    margin-top:4px;
}

.controls{
    display:grid;
    gap:9px;
    margin-top:15px;
}

button{
    border:0;

    padding:12px;

    border-radius:12px;

    color:white;

    font-weight:900;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #ec4899
        );

    box-shadow:
        0 8px 25px #7c3aed44;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

button.secondary{
    background:#ffffff10;
    border:1px solid #ffffff16;
    box-shadow:none;
}

#history{
    max-height:220px;
    overflow:auto;

    margin-top:15px;

    color:#94a3b8;

    font-size:13px;

    line-height:1.8;
}

.promotion{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    z-index:20;

    background:#0009;

    backdrop-filter:blur(8px);
}

.promotion.show{
    display:flex;
}

.promo-box{
    padding:25px;

    border-radius:20px;

    text-align:center;

    background:#10152d;

    border:1px solid #ffffff20;

    box-shadow:0 30px 80px #000;
}

.promo-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.promo-buttons button{
    font-size:35px;
    width:65px;
    height:65px;
}

#toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    padding:12px 22px;

    border-radius:30px;

    background:#111827ee;

    border:1px solid #ffffff20;

    box-shadow:0 10px 40px #0008;

    transition:.3s;

    z-index:30;
}

#toast.show{
    opacity:1;
    transform:
        translate(-50%,0);
}

@media(max-width:850px){

    body{
        padding:10px;
        align-items:flex-start;
    }

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .controls{
        grid-column:1/-1;
        grid-template-columns:1fr 1fr;
    }

    #history{
        grid-column:1/-1;
    }

}

@media(max-width:550px){

    .header{
        margin-bottom:8px;
    }

    .sub{
        display:none;
    }

    .status{
        padding:7px 10px;
    }

    .board-wrap{
        padding:5px;
        border-radius:16px;
    }

    #board{
        border-radius:10px;
    }

    .sidebar{
        padding:10px;
    }

    .player{
        padding:10px;
        margin:0;
    }

    .piece{
        font-size:clamp(
            27px,
            11vw,
            48px
        );
    }

}
</style>
</head>

<body>

<div class="app">

    <div class="header">

        <div>
            <div class="logo">
                ♛ NEON CHESS
            </div>

            <div class="sub">
                Classic Chess • Colorful • Smooth
            </div>
        </div>

        <div class="status">
            <small>TURN</small>
            <strong id="turnText">
                WHITE
            </strong>
        </div>

    </div>


    <div class="layout">

        <div class="board-wrap">
            <div id="board"></div>
        </div>


        <aside class="sidebar">

            <div
                id="whitePlayer"
                class="player active">

                <div class="player-name">
                    ⚪ WHITE
                </div>

                <div class="player-color">
                    Player 1
                </div>

            </div>


            <div
                id="blackPlayer"
                class="player">

                <div class="player-name">
                    🩷 BLACK
                </div>

                <div class="player-color">
                    Player 2
                </div>

            </div>


            <div class="controls">

                <button id="newGame">
                    🔄 New Game
                </button>

                <button
                    id="undo"
                    class="secondary">
                    ↩ Undo
                </button>

            </div>


            <div id="history"></div>

        </aside>

    </div>

</div>


<div
    id="promotion"
    class="promotion">

    <div class="promo-box">

        <h2>
            Pilih Promosi
        </h2>

        <div
            id="promoButtons"
            class="promo-buttons">
        </div>

    </div>

</div>


<div id="toast"></div>


<script>

/* =====================================================
   CHESS ENGINE
===================================================== */

const boardEl =
    document.getElementById("board");

const turnText =
    document.getElementById("turnText");

const historyEl =
    document.getElementById("history");

const whitePlayer =
    document.getElementById("whitePlayer");

const blackPlayer =
    document.getElementById("blackPlayer");

const promotion =
    document.getElementById("promotion");

const promoButtons =
    document.getElementById("promoButtons");

const toast =
    document.getElementById("toast");


const files =
    ["a","b","c","d","e","f","g","h"];


/*
  Unicode chess pieces.
*/

const symbols = {

    white:{
        k:"♔",
        q:"♕",
        r:"♖",
        b:"♗",
        n:"♘",
        p:"♙"
    },

    black:{
        k:"♚",
        q:"♛",
        r:"♜",
        b:"♝",
        n:"♞",
        p:"♟"
    }

};


let board = [];

let turn = "white";

let selected = null;

let legalMoves = [];

let history = [];

let moveHistory = [];

let lastMove = null;

let pendingPromotion = null;


/* =====================================================
   CREATE BOARD
===================================================== */

function createInitialBoard(){

    const b =
        Array.from(
            {length:8},
            () => Array(8).fill(null)
        );


    const back =
        ["r","n","b","q","k","b","n","r"];


    for(let c=0;c<8;c++){

        b[0][c] = {
            type:back[c],
            color:"black"
        };

        b[1][c] = {
            type:"p",
            color:"black"
        };

        b[6][c] = {
            type:"p",
            color:"white"
        };

        b[7][c] = {
            type:back[c],
            color:"white"
        };

    }

    return b;
}


/* =====================================================
   DRAW BOARD
===================================================== */

function render(){

    boardEl.innerHTML = "";

    for(let r=0;r<8;r++){

        for(let c=0;c<8;c++){

            const square =
                document.createElement("div");

            square.className =
                "square " +
                ((r+c)%2===0
                    ? "light"
                    : "dark");


            square.dataset.r = r;
            square.dataset.c = c;


            if(
                lastMove &&
                (
                    (
                        lastMove.from.r===r &&
                        lastMove.from.c===c
                    )
                    ||
                    (
                        lastMove.to.r===r &&
                        lastMove.to.c===c
                    )
                )
            ){

                square.classList.add(
                    "last"
                );

            }


            if(
                selected &&
                selected.r===r &&
                selected.c===c
            ){

                square.classList.add(
                    "selected"
                );

            }


            const piece =
                board[r][c];


            if(
                piece &&
                piece.type==="k" &&
                piece.color===turn &&
                isInCheck(
                    board,
                    turn
                )
            ){

                square.classList.add(
                    "check"
                );

            }


            const move =
                legalMoves.find(
                    m =>
                        m.r===r &&
                        m.c===c
                );


            if(move){

                if(piece){

                    const ring =
                        document.createElement(
                            "div"
                        );

                    ring.className =
                        "capture-ring";

                    square.appendChild(
                        ring
                    );

                }else{

                    const dot =
                        document.createElement(
                            "div"
                        );

                    dot.className =
                        "move-dot";

                    square.appendChild(
                        dot
                    );

                }

            }


            if(piece){

                const pieceEl =
                    document.createElement(
                        "div"
                    );

                pieceEl.className =
                    "piece " +
                    (
                        piece.color==="white"
                        ? "white-piece"
                        : "black-piece"
                    );

                pieceEl.textContent =
                    symbols[
                        piece.color
                    ][
                        piece.type
                    ];

                square.appendChild(
                    pieceEl
                );

            }


            square.addEventListener(
                "click",
                () => handleSquare(r,c)
            );


            boardEl.appendChild(
                square
            );

        }

    }

    updateUI();

}


/* =====================================================
   SQUARE HANDLER
===================================================== */

function handleSquare(r,c){

    const piece =
        board[r][c];


    /*
      Kalau sudah memilih piece
    */

    if(selected){

        const move =
            legalMoves.find(
                m =>
                    m.r===r &&
                    m.c===c
            );


        if(move){

            makeMove(
                selected,
                {r,c}
            );

            return;

        }


        /*
          Klik piece sendiri
          untuk mengganti pilihan.
        */

        if(
            piece &&
            piece.color===turn
        ){

            selectSquare(r,c);

            return;

        }


        selected = null;
        legalMoves = [];

        render();

        return;

    }


    /*
      Pilih piece sendiri
    */

    if(
        piece &&
        piece.color===turn
    ){

        selectSquare(r,c);

    }

}


/* =====================================================
   SELECT
===================================================== */

function selectSquare(r,c){

    selected = {
        r,
        c
    };

    legalMoves =
        getLegalMoves(
            board,
            r,
            c
        );

    render();

}


/* =====================================================
   MOVE
===================================================== */

function makeMove(from,to){

    const moving =
        board[from.r][from.c];

    const captured =
        board[to.r][to.c];


    /*
      Simpan state untuk undo.
    */

    history.push({
        board:cloneBoard(board),
        turn,
        lastMove,
        moveHistory:[
            ...moveHistory
        ]
    });


    /*
      Pawn promotion.
    */

    if(
        moving.type==="p" &&
        (
            to.r===0 ||
            to.r===7
        )
    ){

        pendingPromotion = {
            from,
            to,
            captured
        };

        showPromotion(
            moving.color
        );

        return;

    }


    executeMove(
        from,
        to,
        null
    );

}


/* =====================================================
   EXECUTE
===================================================== */

function executeMove(
    from,
    to,
    promotionType
){

    const moving =
        board[from.r][from.c];

    const captured =
        board[to.r][to.c];


    board[to.r][to.c] = {
        ...moving
    };


    if(promotionType){

        board[to.r][to.c].type =
            promotionType;

    }


    board[from.r][from.c] =
        null;


    /*
      Notasi sederhana.
    */

    const captureText =
        captured
            ? " × "
            : " → ";


    const moveText =
        symbols[
            moving.color
        ][
            moving.type
        ] +
        " " +
        squareName(from) +
        captureText +
        squareName(to);


    moveHistory.push(
        moveText
    );


    lastMove = {
        from:{...from},
        to:{...to}
    };


    selected = null;
    legalMoves = [];


    /*
      Ganti turn.
    */

    turn =
        turn==="white"
        ? "black"
        : "white";


    /*
      Cek status.
    */

    const inCheck =
        isInCheck(
            board,
            turn
        );

    const moves =
        allLegalMoves(
            board,
            turn
        );


    if(
        inCheck &&
        moves.length===0
    ){

        render();

        showToast(
            "♚ CHECKMATE!"
        );

        return;

    }


    if(
        !inCheck &&
        moves.length===0
    ){

        render();

        showToast(
            "🤝 STALEMATE"
        );

        return;

    }


    render();


    if(inCheck){

        showToast(
            "⚡ CHECK!"
        );

    }

}


/* =====================================================
   LEGAL MOVES
===================================================== */

function getLegalMoves(
    b,
    r,
    c
){

    const piece =
        b[r][c];

    if(!piece)
        return [];


    const pseudo =
        getPseudoMoves(
            b,
            r,
            c
        );


    const legal = [];


    for(
        const move of pseudo
    ){

        const copy =
            cloneBoard(b);


        copy[move.r][move.c] =
            copy[r][c];

        copy[r][c] = null;


        if(
            !isInCheck(
                copy,
                piece.color
            )
        ){

            legal.push(move);

        }

    }


    return legal;

}


/* =====================================================
   PSEUDO MOVES
===================================================== */

function getPseudoMoves(
    b,
    r,
    c
){

    const piece =
        b[r][c];

    if(!piece)
        return [];


    const moves = [];


    const add =
        (rr,cc) => {

            if(
                rr<0 ||
                rr>7 ||
                cc<0 ||
                cc>7
            )
                return false;


            const target =
                b[rr][cc];


            if(
                !target
            ){

                moves.push({
                    r:rr,
                    c:cc
                });

                return true;

            }


            if(
                target.color !==
                piece.color &&
                target.type !== "k"
            ){

                moves.push({
                    r:rr,
                    c:cc
                });

            }


            return false;

        };


    /*
      PAWN
    */

    if(piece.type==="p"){

        const dir =
            piece.color==="white"
            ? -1
            : 1;

        const start =
            piece.color==="white"
            ? 6
            : 1;


        if(
            b[r+dir] &&
            !b[r+dir][c]
        ){

            moves.push({
                r:r+dir,
                c
            });


            if(
                r===start &&
                !b[r+dir*2][c]
            ){

                moves.push({
                    r:r+dir*2,
                    c
                });

            }

        }


        for(
            const dc of [-1,1]
        ){

            const rr =
                r+dir;

            const cc =
                c+dc;


            if(
                rr>=0 &&
                rr<8 &&
                cc>=0 &&
                cc<8
            ){

                const target =
                    b[rr][cc];

                if(
                    target &&
                    target.color !==
                    piece.color &&
                    target.type !== "k"
                ){

                    moves.push({
                        r:rr,
                        c:cc
                    });

                }

            }

        }

        return moves;

    }


    /*
      KNIGHT
    */

    if(piece.type==="n"){

        const jumps = [

            [-2,-1],
            [-2,1],
            [-1,-2],
            [-1,2],
            [1,-2],
            [1,2],
            [2,-1],
            [2,1]

        ];


        jumps.forEach(
            ([dr,dc]) =>
                add(
                    r+dr,
                    c+dc
                )
        );

        return moves;

    }


    /*
      KING
    */

    if(piece.type==="k"){

        for(
            let dr=-1;
            dr<=1;
            dr++
        ){

            for(
                let dc=-1;
                dc<=1;
                dc++
            ){

                if(
                    dr!==0 ||
                    dc!==0
                ){

                    add(
                        r+dr,
                        c+dc
                    );

                }

            }

        }

        return moves;

    }


    /*
      SLIDING PIECES
    */

    const directions = [];


    if(
        piece.type==="r" ||
        piece.type==="q"
    ){

        directions.push(
            [-1,0],
            [1,0],
            [0,-1],
            [0,1]
        );

    }


    if(
        piece.type==="b" ||
        piece.type==="q"
    ){

        directions.push(
            [-1,-1],
            [-1,1],
            [1,-1],
            [1,1]
        );

    }


    for(
        const [dr,dc]
        of directions
    ){

        let rr =
            r+dr;

        let cc =
            c+dc;


        while(
            rr>=0 &&
            rr<8 &&
            cc>=0 &&
            cc<8
        ){

            const canContinue =
                add(
                    rr,
                    cc
                );


            if(!canContinue)
                break;


            rr += dr;
            cc += dc;

        }

    }


    return moves;

}


/* =====================================================
   CHECK
===================================================== */

function isInCheck(
    b,
    color
){

    let king = null;


    for(
        let r=0;
        r<8;
        r++
    ){

        for(
            let c=0;
            c<8;
            c++
        ){

            const piece =
                b[r][c];

            if(
                piece &&
                piece.color===color &&
                piece.type==="k"
            ){

                king = {
                    r,
                    c
                };

                break;

            }

        }

        if(king)
            break;

    }


    if(!king)
        return true;


    const enemy =
        color==="white"
        ? "black"
        : "white";


    for(
        let r=0;
        r<8;
        r++
    ){

        for(
            let c=0;
            c<8;
            c++
        ){

            const piece =
                b[r][c];

            if(
                !piece ||
                piece.color!==enemy
            )
                continue;


            const attacks =
                getPseudoMoves(
                    b,
                    r,
                    c
                );


            if(
                attacks.some(
                    m =>
                        m.r===king.r &&
                        m.c===king.c
                )
            ){

                return true;

            }

        }

    }


    return false;

}


/* =====================================================
   ALL LEGAL MOVES
===================================================== */

function allLegalMoves(
    b,
    color
){

    const result = [];


    for(
        let r=0;
        r<8;
        r++
    ){

        for(
            let c=0;
            c<8;
            c++
        ){

            const piece =
                b[r][c];

            if(
                piece &&
                piece.color===color
            ){

                const moves =
                    getLegalMoves(
                        b,
                        r,
                        c
                    );


                moves.forEach(
                    m =>
                        result.push({
                            from:{r,c},
                            to:m
                        })
                );

            }

        }

    }


    return result;

}


/* =====================================================
   CLONE
===================================================== */

function cloneBoard(b){

    return b.map(
        row =>
            row.map(
                p =>
                    p
                    ? {...p}
                    : null
            )
    );

}


/* =====================================================
   SQUARE NAME
===================================================== */

function squareName(pos){

    return (
        files[pos.c] +
        (8-pos.r)
    );

}


/* =====================================================
   PROMOTION
===================================================== */

function showPromotion(
    color
){

    promoButtons.innerHTML = "";


    ["q","r","b","n"].forEach(
        type => {

            const button =
                document.createElement(
                    "button"
                );

            button.textContent =
                symbols[color][type];


            button.addEventListener(
                "click",
                () => {

                    promotion.classList.remove(
                        "show"
                    );


                    executeMove(
                        pendingPromotion.from,
                        pendingPromotion.to,
                        type
                    );


                    pendingPromotion =
                        null;

                }
            );


            promoButtons.appendChild(
                button
            );

        }
    );


    promotion.classList.add(
        "show"
    );

}


/* =====================================================
   UNDO
===================================================== */

function undo(){

    if(
        history.length===0
    ){

        showToast(
            "Tidak ada langkah."
        );

        return;

    }


    const previous =
        history.pop();


    board =
        cloneBoard(
            previous.board
        );

    turn =
        previous.turn;

    lastMove =
        previous.lastMove;

    moveHistory =
        previous.moveHistory;


    selected = null;

    legalMoves = [];


    render();

}


/* =====================================================
   NEW GAME
===================================================== */

function newGame(){

    board =
        createInitialBoard();

    turn =
        "white";

    selected = null;

    legalMoves = [];

    history = [];

    moveHistory = [];

    lastMove = null;

    pendingPromotion = null;


    promotion.classList.remove(
        "show"
    );


    render();

    showToast(
        "♟ Game baru!"
    );

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(text){

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1300
        );

}


/* =====================================================
   UI
===================================================== */

function updateUI(){

    turnText.textContent =
        turn.toUpperCase();


    whitePlayer.classList.toggle(
        "active",
        turn==="white"
    );


    blackPlayer.classList.toggle(
        "active",
        turn==="black"
    );


    historyEl.innerHTML =
        moveHistory
            .map(
                (move,i) =>
                    `<div>
                        ${i+1}. ${move}
                    </div>`
            )
            .join("");

}


/* =====================================================
   BUTTONS
===================================================== */

document
    .getElementById("newGame")
    .addEventListener(
        "click",
        newGame
    );


document
    .getElementById("undo")
    .addEventListener(
        "click",
        undo
    );


/* =====================================================
   START
===================================================== */

board =
    createInitialBoard();

render();

</script>
